name: Refresh profile artwork
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check generator
        run: python -m unittest discover -s scripts -v
      - name: Fetch public activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/activity.py
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ss-sevesh
          outputs: generated/snake.svg?palette=github-dark&color_snake=%23ffb078
      - name: Validate artwork and reduced motion
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('generated/snake.svg')
          root = ET.fromstring(p.read_text())
          style = ET.SubElement(root, '{http://www.w3.org/2000/svg}style')
          style.text = '@media(prefers-reduced-motion:reduce){*{animation:none!important}}'
          ET.register_namespace('', 'http://www.w3.org/2000/svg')
          p.write_text(ET.tostring(root, encoding='unicode'))
          files = list(Path('generated').glob('*.svg')) + list(Path('assets').glob('*.svg'))
          for f in files:
              ET.fromstring(f.read_text())
          assert sum(f.stat().st_size for f in files) < 500_000
          PY
      - name: Publish successful snapshot
        if: github.event_name != 'pull_request'
        run: |
          cp -r generated "$RUNNER_TEMP/profile-artwork"
          if git ls-remote --exit-code origin refs/heads/output >/dev/null; then
            git fetch origin output
            git checkout -B output FETCH_HEAD
          else
            git checkout --orphan output
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/profile-artwork/"* .
          git add contributions.svg activity.svg activity.md snake.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public activity artwork'
          git push origin HEAD:output
